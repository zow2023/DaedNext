name: Package OpenWrt arm64 APK (25.12)

on:
  workflow_dispatch:
    inputs:
      daenext_ref:
        description: Optional DaeNext core branch, tag or SHA. Empty follows .github/daenext-core-ref.
        required: false
        type: string
      package_arches:
        description: Optional OpenWrt package arch list (space separated). Empty uses the script default.
        required: false
        type: string
      package_version:
        description: Optional package version. Empty reads it from the DaeNext workspace Cargo.toml.
        required: false
        type: string
      package_release:
        description: Package release iteration.
        required: false
        type: string
        default: '1'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_PROFILE_RELEASE_LTO: 'fat'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: package-openwrt-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-daenext-ref:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    outputs:
      daenext_ref: ${{ steps.core.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve DaeNext core ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.daenext_ref }}
        run: |
          set -euo pipefail
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="$(tr -d '[:space:]' < .github/daenext-core-ref)"
          fi
          test -n "$ref"
          echo "daenext_ref=$ref" >>"$GITHUB_OUTPUT"
      - name: Resolve core checkout to an immutable commit
        id: core
        uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: ${{ steps.resolve.outputs.daenext_ref }}
          path: DaeNext
          persist-credentials: false
      - name: Record core commit
        env:
          CORE_SHA: ${{ steps.core.outputs.commit }}
        run: printf "DaeNext core commit - \`%s\`\n" "$CORE_SHA" >>"$GITHUB_STEP_SUMMARY"

  package-openwrt-arm64-apk:
    needs: [resolve-daenext-ref]
    name: Build daed and package OpenWrt arm64 apk
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APK_TOOL: ${{ github.workspace }}/build/apk-tools/sbin/apk.static
      OUT_DIR: ${{ github.workspace }}/build/openwrt-arm64-apk
      TARGET_DIR: ${{ github.workspace }}/build/target-openwrt-arm64
      RUST_TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          repository: ksong008/DaeNext
          ref: ${{ needs.resolve-daenext-ref.outputs.daenext_ref }}
          path: DaeNext
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Setup Rust from the checked-out core
        working-directory: DaeNext
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rust-src
          rustup target add aarch64-unknown-linux-gnu
          cargo install bpf-linker --version 0.10.3 --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            DaeNext -> target

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          for attempt in 1 2 3; do
            if sudo apt-get update \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            crossbuild-essential-arm64 \
            libelf-dev \
            llvm \
            perl \
            pkg-config

      - name: Verify cross toolchain
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc --version | head -n 1
          aarch64-linux-gnu-g++ --version | head -n 1
          aarch64-linux-gnu-ar --version | head -n 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm build --filter daed
          mv -T apps/web/dist dist

      - name: Download geodata
        run: |
          set -euo pipefail
          mkdir -p build/package-sources/geodata
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --show-error \
            -o build/package-sources/geodata/geoip.dat \
            https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --show-error \
            -o build/package-sources/geodata/geosite.dat \
            https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat

      - name: Install apk-tools v3 (static)
        run: |
          set -euo pipefail
          mkdir -p build/apk-tools
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --show-error \
            -o build/apk-tools/apk-tools-static.apk \
            https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64/apk-tools-static-3.0.11-r0.apk
          tar -xzf build/apk-tools/apk-tools-static.apk -C build/apk-tools
          "$APK_TOOL" --version

      - name: Resolve package version
        env:
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version = "\([^"]\+\)"/\1/p' DaeNext/Cargo.toml | head -n 1)"
          fi
          test -n "$version"
          echo "PACKAGE_VERSION=$version" >>"$GITHUB_ENV"
          echo "Resolved package version: $version"

      - name: Cross-build daed (aarch64, visible output)
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER:-aarch64-linux-gnu-gcc}" \
          CC_aarch64_unknown_linux_gnu="${CC_aarch64_unknown_linux_gnu:-aarch64-linux-gnu-gcc}" \
          CXX_aarch64_unknown_linux_gnu="${CXX_aarch64_unknown_linux_gnu:-aarch64-linux-gnu-g++}" \
          AR_aarch64_unknown_linux_gnu="${AR_aarch64_unknown_linux_gnu:-aarch64-linux-gnu-ar}" \
          RUSTFLAGS="${RUSTFLAGS:--C target-feature=+crt-static -C target-cpu=generic}" \
            make daed-rust-native DAED_SKIP_WEB_BUILD=1 \
              RUST_WORKSPACE="$GITHUB_WORKSPACE/DaeNext" RUST_TARGET_DIR="$TARGET_DIR" RUST_TARGET="$RUST_TARGET" \
              OUTPUT="$OUT_DIR/daed" VERSION="${DAED_VERSION:-$PACKAGE_VERSION-rb${{ inputs.package_release || '1' }}}" \
              DAED_PRODUCT_TARGET=linux-arm64 2>&1 | tee "$OUT_DIR/daed-cross-build.log"
          file "$OUT_DIR/daed"

      - name: Package OpenWrt arm64 apk
        env:
          OPENWRT_ARM64_PACKAGE_ARCHES: ${{ inputs.package_arches }}
          PACKAGE_RELEASE: ${{ inputs.package_release || '1' }}
        run: |
          set -euo pipefail
          source scripts/package_openwrt_arm64.sh
          build_rootfs "$OUT_DIR/daed" "$OUT_DIR/rootfs"
          for package_arch in $OPENWRT_ARM64_PACKAGE_ARCHES; do
            build_ipk "$OUT_DIR/rootfs" "$OUT_DIR/ipk-control-$package_arch" \
              "$OUT_DIR/daed_${PACKAGE_VERSION}-r${PACKAGE_RELEASE}_openwrt_${package_arch}_jemalloc.ipk" "$package_arch"
            build_apk "$OUT_DIR/rootfs" "$OUT_DIR/apk-scripts-$package_arch" \
              "$OUT_DIR/daed-${PACKAGE_VERSION}-r${PACKAGE_RELEASE}.openwrt-${package_arch}-jemalloc.apk" "$package_arch"
          done
          sha256sum "$OUT_DIR"/*.ipk "$OUT_DIR"/*.apk >"$OUT_DIR/SHA256SUMS"
          file "$OUT_DIR/rootfs/usr/bin/daed" >"$OUT_DIR/daed-openwrt-arm64.file"

      - name: Inspect produced apk packages
        run: |
          set -euo pipefail
          for package in "$OUT_DIR"/*.apk; do
            echo "== $package"
            "$APK_TOOL" adbdump "$package" | head -n 30
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daed-openwrt-arm64-apk-${{ github.sha }}
          retention-days: 14
          path: |
            ${{ env.OUT_DIR }}/*.apk
            ${{ env.OUT_DIR }}/SHA256SUMS
            ${{ env.OUT_DIR }}/daed-openwrt-arm64.file
            ${{ env.OUT_DIR }}/daed-cross-build.log
